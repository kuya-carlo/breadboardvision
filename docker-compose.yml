version: '3.8'

services:
  app:
    image: ghcr.io/kuya-carlo/breadboardvision:latest
    build:
      context: .
      dockerfile: deployment/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_PATH=/data/database.sqlite
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - breadboard-vision-data:/data
    restart: always

volumes:
  breadboard-vision-data:
