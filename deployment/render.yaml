services:
  - type: web
    name: breadboard-vision
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_PATH
        value: /data/database.sqlite
      - key: GEMINI_API_KEY
        sync: false # Set this value manually in the Render dashboard!
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
